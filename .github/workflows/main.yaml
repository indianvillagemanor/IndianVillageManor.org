name: Build & Publish

on:
  push:
    branches:
      - "*"
      - "!dependabot/*"
  workflow_dispatch:

defaults:
  run:
    working-directory: ./ivm_app

jobs:
  next-build:
    runs-on: ubuntu-latest
    container: node:23-alpine3.20
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - run: npm ci
      - run: npm run build
      - name: List files
        run: |
          echo "Listing files in ivm_app/.next:"
          ls -alR .next
          echo "Listing files in ivm_app/public:"
          ls -alR public
      - name: Upload Next build
        uses: actions/upload-artifact@v4
        with:
          name: ivm_app_build
          path: |
            ivm_app/.next
            ivm_app/public
          retention-days: 7
  docker-push:
    needs: next-build
    runs-on: ubuntu-latest
    steps:
      - name: Pre-checkout dir
        run: |
          set -x
          pwd
          ls -a
          echo "Listing files in ivm_app:"
          ls -a ivm_app
      - name: Checkout
        uses: actions/checkout@v4
      - name: Download Next build
        uses: actions/download-artifact@v4
        with:
          name: ivm_app_build
      - name: Post-download dir
        run: |
          set -x
          pwd
          ls -a
          echo "Listing files in ivm_app:"
          ls -a ivm_app
      - name: Login to GitHub Container Registry
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - name: Build and push Docker image
        run: |
          set -x
          pwd
          ls -a
          export CURRENT_BRANCH=${GITHUB_REF#refs/heads/}
          export TAG=$([[ $CURRENT_BRANCH == "main" ]] && echo "latest" || echo $CURRENT_BRANCH)
          REPO="${GITHUB_REPOSITORY,,}"
          export GITHUB_REF_IMAGE=ghcr.io/$REPO:$GITHUB_SHA
          export GITHUB_BRANCH_IMAGE=ghcr.io/$REPO:$TAG
          docker build -t $GITHUB_REF_IMAGE -t $GITHUB_BRANCH_IMAGE ivm_app
          echo "Pushing Image to GitHub Container Registry"
          docker push $GITHUB_REF_IMAGE
          docker push $GITHUB_BRANCH_IMAGE

