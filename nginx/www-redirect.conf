# WWW redirect configuration
server {
    listen 80;
    server_name www.indianvillagemanor.org;
    return 301 https://indianvillagemanor.org$request_uri;
}

server {
    listen 443 ssl http2;
    server_name www.indianvillagemanor.org;

    # SSL Certificate paths (can use same cert as main site with SAN)
    ssl_certificate /etc/letsencrypt/live/indianvillagemanor.org/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/indianvillagemanor.org/privkey.pem;

    # SSL Configuration
    ssl_protocols TLSv1.2 TLSv1.3;
    ssl_ciphers ECDHE-RSA-AES128-GCM-SHA256:ECDHE-RSA-AES256-GCM-SHA384;
    ssl_prefer_server_ciphers on;
    ssl_session_cache shared:SSL:10m;
    ssl_session_timeout 10m;

    # Redirect to non-www
    return 301 https://indianvillagemanor.org$request_uri;
}