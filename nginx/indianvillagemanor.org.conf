# Main site configuration for indianvillagemanor.org
server {
    listen 80;
    server_name indianvillagemanor.org;
    return 301 https://$server_name$request_uri;
}

server {
    listen 443 ssl http2;
    server_name indianvillagemanor.org;

    # SSL Certificate paths (adjust paths as needed)
    ssl_certificate /etc/letsencrypt/live/indianvillagemanor.org/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/indianvillagemanor.org/privkey.pem;

    # SSL Configuration
    ssl_protocols TLSv1.2 TLSv1.3;
    ssl_ciphers ECDHE-RSA-AES128-GCM-SHA256:ECDHE-RSA-AES256-GCM-SHA384;
    ssl_prefer_server_ciphers on;
    ssl_session_cache shared:SSL:10m;
    ssl_session_timeout 10m;

    # Security headers
    add_header X-Frame-Options DENY;
    add_header X-Content-Type-Options nosniff;
    add_header X-XSS-Protection "1; mode=block";
    add_header Strict-Transport-Security "max-age=31536000; includeSubDomains" always;

    # Proxy to Docker container
    location / {
        proxy_pass http://localhost:3000;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection 'upgrade';
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_cache_bypass $http_upgrade;
        proxy_read_timeout 86400;
    }

    # Optional: serve static files directly from nginx for better performance
    # location /_next/static/ {
    #     alias /var/www/indianvillagemanor/static/;
    #     expires 1y;
    #     add_header Cache-Control "public, immutable";
    # }
}